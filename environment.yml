# Portable, direct dependencies for the CAP repository.
# Model data (spaCy and Benepar) is installed after creating the environment.
name: LLMs_grouping
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - accelerate==0.34.2
      - benepar==0.2.0
      - jaxtyping==0.2.36
      - nltk==3.8.1
      - numpy==1.24.3
      - saf-datasets==0.4.7
      - scikit-learn==1.3.0
      - scipy==1.11.1
      - sentence-transformers==3.1.1
      - spacy==3.7.2
      - torch==2.1.2
      - tqdm==4.65.0
      - transformer-lens==2.11.0
      - transformers==4.44.2